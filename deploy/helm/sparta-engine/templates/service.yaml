apiVersion: v1
kind: Service
metadata:
  name: {{ include "sparta-engine.fullname" . }}
  labels: {{- include "sparta-engine.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: s3
      protocol: TCP
      name: s3
  selector: {{- include "sparta-engine.selectorLabels" . | nindent 4 }}
